[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-rag-backend"
version = "0.1.0"
description = "Everything RAG 个人知识第二大脑 —— 后端（纯本地）"
requires-python = ">=3.11"
dependencies = [
    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 文档解析与切块
    "markdown-it-py>=3.0",
    # 向量库
    "chromadb>=0.5",
    # 模型调用（OpenAI 兼容）
    "openai>=1.54",
    # 联网搜索 provider 的 HTTP 客户端（Tavily / SearXNG）
    "httpx>=0.27",
    # 文件上传表单解析（/api/import/upload multipart）
    "python-multipart>=0.0.9",
    # 增量同步指纹 / 编码 / 图片
    "xxhash>=3.5",
    "charset-normalizer>=3.4",
    "Pillow>=10.4",
    # 状态存储
    "aiosqlite==0.22.1",
    # Agent 编排（V1.2.0）：LangGraph 主图/研究图 + 每工作区 checkpoint
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    # 历史检索：FTS5 前置中文分词（PRD 11.5）
    "jieba==0.42.1",
]

[project.optional-dependencies]
deepseek-budget = [
    "deepseek-recipe @ git+https://github.com/deepseek-ai/deepseek-recipe.git@8cadfede7063c896b944e7bae05daa3549ae97ea#subdirectory=deepseek-recipe-python",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

# 分发内容 = **只有** `app` 包（一切顶层目录都是平铺布局：app / tests / live_tests / scripts）。
# 不写这一段时 setuptools 自动发现会因为「Multiple top-level packages discovered in a
# flat-layout: ['app', 'live_tests']」直接拒绝构建 —— `pip install -e .` 失败会让启动脚本的
# 依赖校验中止，项目起不来（2026-09-21 实测）。显式声明后，今后再新增顶层目录
# （例如新的 live 用例目录）也不会再破坏安装。
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "live_tests*", "scripts*"]

[tool.setuptools.package-data]
"app.generation" = ["resources/deepseek-v41/tokenizer.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# pytest 惯例：把 `tests/fakes_agent.py` 的共享夹具导入到测试模块命名空间
# （pytest 只自动发现 conftest.py 的夹具），此时测试函数参数与导入同名，
# pyflakes 会误报 F811（redefinition of unused name）。夹具名由 pytest 解析，
# 不是真实的重复定义。仅对测试目录放宽这一条，其余规则照常。
"tests/*.py" = ["F811"]

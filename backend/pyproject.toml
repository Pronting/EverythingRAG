[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-rag-backend"
version = "0.1.0"
description = "Everything RAG 个人知识第二大脑 —— 后端（纯本地）"
requires-python = ">=3.11"
dependencies = [
    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 文档解析与切块
    "markdown-it-py>=3.0",
    # 向量库
    "chromadb>=0.5",
    # 模型调用（OpenAI 兼容）
    "openai>=1.54",
    # 联网搜索 provider 的 HTTP 客户端（Tavily / SearXNG）
    "httpx>=0.27",
    # 文件上传表单解析（/api/import/upload multipart）
    "python-multipart>=0.0.9",
    # 增量同步指纹 / 编码 / 图片
    "xxhash>=3.5",
    "charset-normalizer>=3.4",
    "Pillow>=10.4",
    # 状态存储
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

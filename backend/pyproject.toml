[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-rag-backend"
version = "0.1.0"
description = "Everything RAG 个人知识第二大脑 —— 后端（纯本地）"
requires-python = ">=3.11"
dependencies = [
    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 文档解析与切块
    "markdown-it-py>=3.0",
    # 向量库
    "chromadb>=0.5",
    # 模型调用（OpenAI 兼容）
    "openai>=1.54",
    # 联网搜索 provider 的 HTTP 客户端（Tavily / SearXNG）
    "httpx>=0.27",
    # 文件上传表单解析（/api/import/upload multipart）
    "python-multipart>=0.0.9",
    # 增量同步指纹 / 编码 / 图片
    "xxhash>=3.5",
    "charset-normalizer>=3.4",
    "Pillow>=10.4",
    # 状态存储
    "aiosqlite==0.22.1",
    # Agent 编排（V1.2.0）：LangGraph 主图/研究图 + 每工作区 checkpoint
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    # 历史检索：FTS5 前置中文分词（PRD 11.5）
    "jieba==0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# pytest 惯例：把 `tests/fakes_agent.py` 的共享夹具导入到测试模块命名空间
# （pytest 只自动发现 conftest.py 的夹具），此时测试函数参数与导入同名，
# pyflakes 会误报 F811（redefinition of unused name）。夹具名由 pytest 解析，
# 不是真实的重复定义。仅对测试目录放宽这一条，其余规则照常。
"tests/*.py" = ["F811"]

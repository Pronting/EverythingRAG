<!DOCTYPE html>
<html lang="zh-CN">

<title>鹈鹕骑自行车 · SVG</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    padding: 24px;
    background: radial-gradient(120% 120% at 15% 0%, #eef6ff 0%, #d6e6f7 55%, #bfd2e8 100%);
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(100%, 1020px);
    border-radius: 26px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 28px 60px -22px rgba(24, 52, 88, .5), 0 2px 0 rgba(255,255,255,.7) inset;
  }
  svg { display: block; width: 100%; height: auto; background: #cfe8ff; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .clouds { animation: drift 52s linear infinite; }

  @keyframes road { to { stroke-dashoffset: -84; } }
  .road-line { stroke-dasharray: 48 36; animation: road .85s linear infinite; }
  @keyframes chain { to { stroke-dashoffset: -24; } }
  .chain { stroke-dasharray: 8 5; animation: chain .45s linear infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5px); }
  }
  .rider { animation: bob 1.4s ease-in-out infinite; }

  @keyframes flutter {
    0%, 100% { transform: rotate(-6deg) skewY(0deg); }
    50%      { transform: rotate(5deg) skewY(-9deg); }
  }
  .scarf-tail {
    transform-box: fill-box;
    transform-origin: 100% 72%;
    animation: flutter .95s ease-in-out infinite;
  }
  .scarf-tail.b { animation-duration: 1.35s; animation-delay: -.45s; }

  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.08); }
  }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(9deg); }
  }
  .fish { transform-box: fill-box; transform-origin: 50% 100%; animation: wiggle 1.15s ease-in-out infinite; }

  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.35); opacity: .6; }
    60%  { opacity: .2; }
    100% { transform: translate(-52px, -30px) scale(1.6); opacity: 0; }
  }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 1.35s ease-out infinite; opacity: 0; }
  .puff:nth-child(2) { animation-delay: .45s; }
  .puff:nth-child(3) { animation-delay: .9s; }

  @keyframes breeze {
    0%, 100% { opacity: .12; transform: translateX(0); }
    50%      { opacity: .38; transform: translateX(-26px); }
  }
  .breeze { animation: breeze 1.6s ease-in-out infinite; }
  .breeze.b { animation-duration: 2.1s; animation-delay: -.7s; }
</style>
</head>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var HIP_N = { x: 438, y: 252 };
  var HIP_F = { x: 426, y: 246 };
  var C     = { x: 455, y: 405 };
  var R = 30;        // 曲柄长度
  var L = 97;        // 单节腿长
  var PERIOD = 1400; // 蹬一圈的毫秒数

  // 两骨骼 IK：已知髋与脚，解出膝关节（取朝前的那个解）
  function joint(h, p) {
    var dx = p.x - h.x, dy = p.y - h.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var max = 2 * L - 1;
    if (d > max) { var s = max / d; dx *= s; dy *= s; d = max; }
    var a  = d / 2;
    var hh = Math.sqrt(Math.max(0, L * L - a * a));
    var mx = h.x + dx / 2, my = h.y + dy / 2;
    var px = -dy / d, py = dx / d;
    return { x: mx - hh * px, y: my - hh * py };
  }

  function setLeg(tag, hip, pedal) {
    var k = joint(hip, pedal);
    var d = 'M' + hip.x + ' ' + hip.y +
            ' L' + k.x.toFixed(2) + ' ' + k.y.toFixed(2) +
            ' L' + pedal.x.toFixed(2) + ' ' + pedal.y.toFixed(2);
    $('leg' + tag + 'Out').setAttribute('d', d);
    $('leg' + tag + 'In').setAttribute('d', d);
    $('foot' + tag).setAttribute('transform',
      'translate(' + pedal.x.toFixed(2) + ' ' + pedal.y.toFixed(2) + ')');
    $('pedal' + tag).setAttribute('transform',
      'translate(' + pedal.x.toFixed(2) + ' ' + pedal.y.toFixed(2) + ')');
  }

  var t0 = performance.now();

  function tick(now) {
    var th = ((now - t0) / PERIOD) * Math.PI * 2;   // 曲柄角（弧度）
    var a  = th * 180 / Math.PI;

    // 曲柄 rotate(θ) 后，局部点 (0,R) 落在 (-R·sinθ, R·cosθ)
    var pN = { x: C.x - R * Math.sin(th), y: C.y + R * Math.cos(th) };
    var pF = { x: C.x + R * Math.sin(th), y: C.y - R * Math.cos(th) };

    $('crankNear').setAttribute('transform', 'translate(' + C.x + ' ' + C.y + ') rotate(' + a.toFixed(2) + ')');
    $('crankFar').setAttribute('transform',  'translate(' + C.x + ' ' + C.y + ') rotate(' + (a + 180).toFixed(2) + ')');
    $('ring').setAttribute('transform',      'translate(' + C.x + ' ' + C.y + ') rotate(' + a.toFixed(2) + ')');

    setLeg('Near', HIP_N, pN);
    setLeg('Far',  HIP_F, pF);

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
